[project]
name = "bugit-v2"
version = "2.11"
description = "Cool new Bugit"
authors = [{ name = "Zhongning Li", email = "zhongning.li@canonical.com" }]
requires-python = ">=3.12,<4.0.0"
readme = "README.md"
dependencies = [
    "textual>=8.2.8",
    "pyyaml>=6.0.3",
    "jira>=3.10.5",
    "launchpadlib>=2.3.0",
    "pydantic[email]>=2.14.3,<3.0.0",
    "typer>=0.29.2",
    "systemd>=0.17.1",
    "ijson>=3.6.0",
    "openai>=3.55.1",
]

[project.scripts]
bugit-v2 = "bugit_v2.apps.app:cli_app"

[dependency-groups]
dev = [
    "isort>=9.0.2",
    "textual-dev>=1.8.0",
    "pre-commit>=4.7.0",
    "black>=26.10.1",
    "basedpyright>=1.40.2",
    "async-timeout>=5.0.1",
    "ruff>=0.17.5",
]

[tool.hatch.build.targets.sdist]
include = ["src/bugit_v2"]

[tool.hatch.build.targets.wheel]
include = ["src/bugit_v2"]

[tool.hatch.build.targets.wheel.sources]
"src/bugit_v2" = "bugit_v2"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 89
include = '(\.pyi?|\.ipynb)$'

[tool.isort]
profile = "black"
