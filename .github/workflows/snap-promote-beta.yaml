name: Weekly release edge to beta

on:
  # run after the daily build so promotion never races its uploads
  workflow_run:
    workflows: ["Daily snap build to edge"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# shared with the other snap workflow so edge uploads and beta releases
# never overlap
concurrency:
  group: snap-store-publish
  cancel-in-progress: false

jobs:
  check:
    # weekly: only promote after a successful scheduled daily run on Monday
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'schedule')
    runs-on: [self-hosted, self-hosted-linux-amd64-noble-medium]
    outputs:
      promote: ${{ steps.day.outputs.promote }}
    steps:
      - id: day
        env:
          RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] \
            || [ "$(date -u -d "$RUN_STARTED_AT" +%u)" = 1 ]; then
            echo "promote=true" >> "$GITHUB_OUTPUT"
          else
            echo "Daily build did not start on a Monday, skipping"
          fi

  resolve:
    needs: check
    if: needs.check.outputs.promote == 'true'
    runs-on: [self-hosted, self-hosted-linux-amd64-noble-medium]
    outputs:
      sha: ${{ steps.edge.outputs.sha }}
    steps:
      # the store can't change a revision's version on promotion, so instead
      # rebuild the commit currently in edge (2.11+git<sha>) as plain 2.11
      - id: edge
        run: |
          version="$(snap info bugit | awk '$1 == "latest/edge:" { print $2 }')"
          echo "latest/edge version: $version"
          sha="${version##*+git}"
          if ! [[ "$version" == *+git* && "$sha" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::Cannot find a commit in edge version '$version'"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  release:
    needs: resolve
    uses: ./.github/workflows/snap-build.yaml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      append-commit: false
      channel: latest/beta
    secrets: inherit
