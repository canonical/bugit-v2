name: Weekly release edge to beta

on:
  # weekly, a few hours after the Monday daily build. Promotes whatever is in
  # latest/edge regardless of how that build ended, so one bad arch doesn't
  # block beta for a week
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# shared with the other snap workflow so edge uploads and beta releases
# never overlap
concurrency:
  group: snap-store-publish
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: [self-hosted, self-hosted-linux-amd64-noble-medium]
    outputs:
      sha: ${{ steps.edge.outputs.sha }}
    steps:
      # full history so the short sha from the edge version can be resolved,
      # actions/checkout only accepts full shas or branch/tag names as ref
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # the store can't change a revision's version on promotion, so instead
      # rebuild the commit currently in edge (2.11+git<sha>) as plain 2.11
      - id: edge
        run: |
          version="$(snap info bugit | awk '$1 == "latest/edge:" { print $2 }')"
          echo "latest/edge version: $version"
          short="${version##*+git}"
          if ! [[ "$version" == *+git* && "$short" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::Cannot find a commit in edge version '$version'"
            exit 1
          fi
          if ! sha="$(git rev-parse --verify --quiet "${short}^{commit}")"; then
            echo "::error::Commit '$short' from edge version not found"
            exit 1
          fi
          echo "Resolved $short to $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  release:
    needs: resolve
    uses: ./.github/workflows/snap-build.yaml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      append-commit: false
      channel: latest/beta
    secrets: inherit
