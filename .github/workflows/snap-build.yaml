name: Build and publish snap

# reusable workflow shared by the daily edge build and the weekly beta release
# no workflow-level concurrency here, the callers already hold the
# snap-store-publish group and sharing it would deadlock
on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref/sha to build, defaults to the triggering commit"
        type: string
        default: ""
      append-commit:
        description: "Append +git<short sha> to the snap version"
        type: boolean
        default: false
      channel:
        description: "Store channel to release to, e.g. latest/edge"
        type: string
        required: true
      upload:
        description: "Upload the built snaps to the store"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  native:
    name: Native build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: self-hosted-linux-amd64-noble-medium
          - arch: arm64
            runner: self-hosted-linux-arm64-noble-medium
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    environment: snap-store
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Append commit to snap version
        if: inputs.append-commit
        run: |
          sha="$(git rev-parse --short=7 HEAD)"
          sed -i -E "s/^version: \"?([^\"+]+)\"?$/version: \"\1+git${sha}\"/" \
            snap/snapcraft.yaml
          grep -E "^version: \"[^\"]+\+git${sha}\"$" snap/snapcraft.yaml

      - id: build
        uses: snapcore/action-build@v1
        with:
          snapcraft-args: --use-lxd

      - uses: actions/upload-artifact@v7
        with:
          name: bugit_${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: snapcraft-logs-${{ matrix.arch }}
          path: |
            ~/.cache/snapcraft/log/
            ~/.local/state/snapcraft/log/

      - name: Publish to ${{ inputs.channel }}
        if: inputs.upload
        uses: canonical/action-publish@v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ inputs.channel }}

  qemu:
    name: QEMU build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [armhf, riscv64]
    # the multiarch action builds inside docker, which these runners ship with
    runs-on: [self-hosted, self-hosted-linux-amd64-noble-medium]
    environment: snap-store
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Append commit to snap version
        if: inputs.append-commit
        run: |
          sha="$(git rev-parse --short=7 HEAD)"
          sed -i -E "s/^version: \"?([^\"+]+)\"?$/version: \"\1+git${sha}\"/" \
            snap/snapcraft.yaml
          grep -E "^version: \"[^\"]+\+git${sha}\"$" snap/snapcraft.yaml

      - uses: docker/setup-qemu-action@v4
        with:
          # the default binfmt image breaks riscv64 snapcraft builds, see
          # https://github.com/tonistiigi/binfmt/issues/215
          # https://bugs.launchpad.net/ubuntu/+source/qemu/+bug/2096782
          image: tonistiigi/binfmt:master

      - id: build
        uses: canonical/snapcraft-multiarch-action@v1
        with:
          architecture: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: bugit_${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}

      - name: Publish to ${{ inputs.channel }}
        if: inputs.upload
        uses: canonical/action-publish@v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ inputs.channel }}
