name: Daily snap build to edge

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      store_upload:
        description: "Upload the built snaps to latest/edge"
        type: boolean
        default: true

permissions:
  contents: read

# shared with the other snap workflow so edge uploads and beta releases
# never overlap
concurrency:
  group: snap-store-publish
  cancel-in-progress: false

jobs:
  build:
    # edge snaps are versioned like 2.11+gitb35def8, the beta workflow reads
    # the commit back from this version to rebuild the same source
    uses: ./.github/workflows/snap-build.yaml
    with:
      append-commit: true
      channel: latest/edge
      # scheduled runs have no inputs, so default to uploading
      upload: ${{ github.event_name == 'schedule' || inputs.store_upload }}
    secrets: inherit
